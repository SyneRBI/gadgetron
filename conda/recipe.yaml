# Usage:
#   rattler-build build -r conda -c conda-forge -c ismrmrd --target-platform {linux-64,osx-arm64,win-64} [--variant cuda_compiler_version=12.9]
# Channel includes:
# - ismrmrd::mrd-storage-server (gadgetron run dep; linux-64 + osx-64 only)
#
# ismrmrd is built from source here (as in SIRF-SuperBuild) because
# conda-forge has no pre-built ismrmrd for Boost 1.90. Only the gadgetron
# package is published (to the syneRBI channel); ismrmrd is a local build
# dependency.

schema_version: 1

context:
  # pet-rd-tools==2.2.0 needs boost==1.90
  # stir==6.4.0 needs boost>=1.90
  boost: 1.90.0.*
  hdf5: 1.14.6
  cuda_version: ${{ cuda_compiler_version if cuda_compiler_version is defined and cuda_compiler_version != "None" else "None" }}
  with_cuda: ${{ "true" if cuda_version != "None" else "" }}
  cuda_major: ${{ (cuda_version | split(".") | first) if with_cuda else "0" }}
  cuda_build_prefix: ${{ "cuda" ~ (cuda_version | version_to_buildstring) if with_cuda else "cpu" }}
  c_cache_c: ${{ env.get("CMAKE_C_COMPILER_LAUNCHER", default="ccache") }}
  c_cache_cxx: ${{ env.get("CMAKE_CXX_COMPILER_LAUNCHER", default="ccache") }}
  ccache_dir: ${{ env.get("CCACHE_DIR", default="") }}
  ccache_maxsize: ${{ env.get("CCACHE_MAXSIZE", default="5G") }}

about:
  summary: Gadgetron MR image reconstruction framework (CPU-only, SyneRBI fork)
  # Custom "GADGETRON SOFTWARE LICENSE V1.0" (NIH public-domain-style)
  license: LicenseRef-GADGETRON
  license_file: LICENSE
  repository: https://github.com/SyneRBI/gadgetron

outputs:
  - package:
      name: ismrmrd
      version: "1.15.0"
    inherit: null
    source:
      git: https://github.com/ismrmrd/ismrmrd.git
      tag: v1.15.0
    build:
      number: 0
      script:
        content:
          - if: unix
            then: cmake -G Ninja $SRC_DIR -B $BUILD_PREFIX/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX -DBUILD_STATIC:BOOL=OFF -DBUILD_TESTS:BOOL=OFF -DBUILD_UTILITIES:BOOL=OFF -DBUILD_EXAMPLES:BOOL=OFF
            else: cmake -G Ninja "%SRC_DIR%" -B "%BUILD_PREFIX%/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="%LIBRARY_PREFIX%" -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%" -DBUILD_STATIC:BOOL=OFF -DBUILD_TESTS:BOOL=OFF -DBUILD_UTILITIES:BOOL=OFF -DBUILD_EXAMPLES:BOOL=OFF
          - if: unix
            then: cmake --build $BUILD_PREFIX/build --config Release
            else: cmake --build "%BUILD_PREFIX%/build" --config Release
          - if: unix
            then: cmake --install $BUILD_PREFIX/build --config Release
            else: cmake --install "%BUILD_PREFIX%/build" --config Release
        env:
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
    requirements:
      build:
        - ccache
        - cmake
        - ninja
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - fftw
        - hdf5 ==${{ hdf5 }}
        - libboost-devel ${{ boost }}
        - nlohmann_json
        - pugixml
      run:
        - fftw
        - hdf5 ~=${{ hdf5 }}
        - libboost-devel ${{ boost }}
        - pugixml
    tests:
      - script:
          - if: unix
            then: test -f $PREFIX/lib/cmake/ISMRMRD/ISMRMRDConfig.cmake
            else: if not exist "%LIBRARY_PREFIX%\lib\cmake\ISMRMRD\ISMRMRDConfig.cmake" exit 1
    about:
      summary: "ISMRMRD data format library"
      homepage: https://github.com/ismrmrd/ismrmrd
      license: LicenseRef-ISMRMRD
      license_file: LICENSE
      repository: https://github.com/ismrmrd/ismrmrd

  - package:
      name: gadgetron
      version: "4.7.2"
    inherit: null
    source:
      path: ..
    build:
      number: 0
      string: ${{ cuda_build_prefix }}
      variant:
        use_keys:
          - ${{ "cuda" if with_cuda }}
        down_prioritize_variant: ${{ 0 if with_cuda else 1 }}
      script:
        file: ${{ "build-gadgetron.ps1" if win else "build-gadgetron.sh" }}
        env:
          cuda_compiler_version: ${{ cuda_version }}
          USE_CUDA: ${{ 'ON' if with_cuda else 'OFF' }}
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
    requirements:
      build:
        - ccache
        - cmake
        - ninja
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: with_cuda
          then: ${{ compiler('cuda') }}
      host:
        # armadillo>-12 (libar2) required by Gadgetron 4.7
        - armadillo >=12,<13
        - libboost-devel ${{ boost }}
        - fftw
        - hdf5 ==${{ hdf5 }}
        - howardhinnant_date
        - ${{ pin_subpackage('ismrmrd', exact=True) }}
        # BLAS/LAPACK pinned to the netlib 3.11.0 builds (see comment in sirf)
        - libblas 3.11.0.* *_netlib
        - libcblas 3.11.0.* *_netlib
        - libcurl
        - if: linux
          then: libgomp
        - if: osx
          then: llvm-openmp
        - liblapack 3.11.0.* *_netlib
        - liblapacke 3.11.0.* *_netlib
        - nlohmann_json
        - pugixml
        - range-v3
        - if: with_cuda
          then:
            - cuda-version ==${{ cuda_version }}
            - if: (cuda_major | int) >= 12
              then: cuda-cudart-dev
            - libcublas-dev
            - libcufft-dev
            - libcusparse-dev
      run:
        - armadillo >=12,<13
        - libboost-devel ${{ boost }}
        - fftw
        - hdf5 ~=${{ hdf5 }}
        - howardhinnant_date
        - ${{ pin_subpackage('ismrmrd') }}
        - libblas 3.11.0.* *_netlib
        - libcblas 3.11.0.* *_netlib
        - libcurl
        - if: linux
          then: libgomp
        - if: osx
          then: llvm-openmp
        - liblapack 3.11.0.* *_netlib
        - liblapacke 3.11.0.* *_netlib
        # ismrmrd::mrd-storage-server doesn't exist on all platforms
        - if: target_platform == "linux-64" or target_platform == "osx-64"
          then: mrd-storage-server
        - nlohmann_json
        - pugixml
        - range-v3
        - if: with_cuda
          then:
            - __cuda
            - cuda-version ~=${{ cuda_version }}
            - cuda-cudart
            - libcublas
            - libcufft
            - libcusparse
            - libcurand
      ignore_run_exports:
        by_name:
          - if: with_cuda
            then:
              - cuda-version
              - cuda-cudart-dev
    tests:
      - script:
          - if: unix
            then: test -x $PREFIX/bin/gadgetron
            else: if not exist "%LIBRARY_PREFIX%\bin\gadgetron.exe" exit 1
          - if: unix
            then: test -x $PREFIX/bin/gadgetron_ismrmrd_client
            else: if not exist "%LIBRARY_PREFIX%\bin\gadgetron_ismrmrd_client.exe" exit 1
          - if: unix
            then: test -f $PREFIX/lib/libgadgetron_core.so -o -f $PREFIX/lib/libgadgetron_core.dylib -o -f $PREFIX/lib/libgadgetron_core.a
            else: if not exist "%LIBRARY_PREFIX%\bin\gadgetron_core.dll" exit 1
    about:
      summary: "Gadgetron MR image reconstruction framework (CPU-only, SyneRBI fork)"
      # Custom "GADGETRON SOFTWARE LICENSE V1.0" (NIH public-domain-style)
      license: LicenseRef-GADGETRON
      license_file: LICENSE
      repository: https://github.com/SyneRBI/gadgetron
