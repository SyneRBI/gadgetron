# Usage:
#   rattler-build build -r conda -c conda-forge -c synerbi --target-platform {linux-64,osx-arm64,win-64} [--variant cuda_compiler_version=12.9]
# Channel includes:
# - synerbi::{ismrmrd,mrd-storage-server}

schema_version: 1

context:
  cuda_version: ${{ cuda_compiler_version if cuda_compiler_version is defined and cuda_compiler_version != "None" else "None" }}
  with_cuda: ${{ "true" if cuda_version != "None" else "" }}
  cuda_major: ${{ (cuda_version | split(".") | first) if with_cuda else "0" }}
  cuda_build_prefix: ${{ "cuda" ~ (cuda_version | version_to_buildstring) if with_cuda else "cpu" }}
  c_cache_c: ${{ env.get("CMAKE_C_COMPILER_LAUNCHER", default="ccache") }}
  c_cache_cxx: ${{ env.get("CMAKE_CXX_COMPILER_LAUNCHER", default="ccache") }}
  ccache_dir: ${{ env.get("CCACHE_DIR", default="") }}
  ccache_maxsize: ${{ env.get("CCACHE_MAXSIZE", default="5G") }}

package:
  name: gadgetron
  version: "4.7.2"

source:
  path: ..

build:
  number: 0
  string: ${{ cuda_build_prefix }}_b${{ boost | version_to_buildstring | replace("*", "x") }}_h${{ hdf5 | version_to_buildstring | replace("*", "x") }}
  variant:
    use_keys:
      - ${{ "cuda" if with_cuda }}
    down_prioritize_variant: ${{ 0 if with_cuda else 1 }}
  script:
    file: ${{ "build-gadgetron.ps1" if win else "build-gadgetron.sh" }}
    env:
      cuda_compiler_version: ${{ cuda_version }}
      USE_CUDA: ${{ 'ON' if with_cuda else 'OFF' }}
      CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
      CCACHE_DIR: ${{ ccache_dir }}
      CCACHE_MAXSIZE: ${{ ccache_maxsize }}

requirements:
  build:
    - ccache
    - cmake
    - ninja
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - if: with_cuda
      then: ${{ compiler('cuda') }}
  host:
    # armadillo>-12 (libar2) required by Gadgetron 4.7
    - armadillo >=12,<13
    - libboost-devel ${{ boost }}.*
    - fftw
    - hdf5
    - howardhinnant_date
    - ismrmrd ~=1.15
    # BLAS/LAPACK pinned to the netlib 3.11.0 builds (see comment in sirf)
    - libblas 3.11.0.* *_netlib
    - libcblas 3.11.0.* *_netlib
    - libcurl
    - if: linux
      then: libgomp
    - if: osx
      then: llvm-openmp
    - liblapack 3.11.0.* *_netlib
    - liblapacke 3.11.0.* *_netlib
    - nlohmann_json
    - pugixml
    - range-v3
    - if: with_cuda
      then:
        - cuda-version ==${{ cuda_version }}
        - if: (cuda_major | int) >= 12
          then: cuda-cudart-dev
        - libcublas-dev
        - libcufft-dev
        - libcusparse-dev
  run:
    - libblas 3.11.0.* *_netlib
    - libcblas 3.11.0.* *_netlib
    - liblapack 3.11.0.* *_netlib
    - liblapacke 3.11.0.* *_netlib
    - mrd-storage-server
    - if: with_cuda
      then:
        - __cuda
        - cuda-version ~=${{ cuda_version }}
        - cuda-cudart
        - libcublas
        - libcufft
        - libcusparse

tests:
  - script:
      - if: unix
        then: test -x $PREFIX/bin/gadgetron
        else: if not exist "%LIBRARY_PREFIX%\bin\gadgetron.exe" exit 1
      - if: unix
        then: test -x $PREFIX/bin/gadgetron_ismrmrd_client
        else: if not exist "%LIBRARY_PREFIX%\bin\gadgetron_ismrmrd_client.exe" exit 1
      - if: unix
        then: test -f $PREFIX/lib/libgadgetron_core.so -o -f $PREFIX/lib/libgadgetron_core.dylib -o -f $PREFIX/lib/libgadgetron_core.a
        else: if not exist "%LIBRARY_PREFIX%\bin\gadgetron_core.dll" exit 1

about:
  summary: Gadgetron MR image reconstruction framework (SyneRBI fork)
  # Custom "GADGETRON SOFTWARE LICENSE V1.0" (NIH public-domain-style)
  license: LicenseRef-GADGETRON
  license_file: LICENSE
  repository: https://github.com/SyneRBI/gadgetron
